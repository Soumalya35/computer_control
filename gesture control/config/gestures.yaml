# Gestures Configuration
# Gesture Definitions, Roles, Temporal Voting & Cooldown Timers

stabilization:
  temporal_window: 5
  temporal_votes: 3
  confidence_threshold: 0.65
  candidate_threshold: 0.60

gestures:
  # ==========================================
  # PRIMARY HAND GESTURES (Pointer / Action)
  # ==========================================
  primary_pointing:
    name: "POINTING"
    role: "PRIMARY"
    fingers: [0, 1, 0, 0, 0]
    action: "MOVE_MOUSE"
    category: "mouse"
    mode: "CONTINUOUS"
    cooldown: 0.0
    priority: 10

  primary_pointing_relaxed:
    name: "POINTING_RELAXED"
    role: "PRIMARY"
    fingers: [1, 1, 0, 0, 0]
    action: "MOVE_MOUSE"
    category: "mouse"
    mode: "CONTINUOUS"
    cooldown: 0.0
    priority: 10

  primary_pinch:
    name: "PINCH"
    role: "PRIMARY"
    action: "LEFT_CLICK"
    category: "mouse"
    mode: "STATE_MACHINE"
    cooldown: 0.35
    priority: 20

  primary_two_fingers_tight:
    name: "TWO_FINGERS_TIGHT"
    role: "PRIMARY"
    fingers: [0, 1, 1, 0, 0]
    action: "SCROLL_MODE"
    category: "scroll"
    mode: "CONTINUOUS"
    cooldown: 0.0
    priority: 15

  primary_two_fingers_relaxed:
    name: "TWO_FINGERS_RELAXED"
    role: "PRIMARY"
    fingers: [1, 1, 1, 0, 0]
